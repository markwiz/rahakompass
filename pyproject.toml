[project]
name = "rahakompass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "markwiz", email = "mmark.kuusik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "diskcache>=5.6.3",
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rahakompass = "rahakompass:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
